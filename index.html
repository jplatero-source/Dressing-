<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cut">
<meta name="theme-color" content="#f5f0e8">
<title>Rien à me mettre</title>
<style>
  :root {
    --bg: #f5f0e8;
    --surface: #fffdf9;
    --ink: #2b2622;
    --muted: #8a8079;
    --line: #e7dfd3;
    --accent: #c4553b;
    --accent-ink: #fff;
    --like: #2f8f5b;
    --nope: #c43b3b;
    --radius: 18px;
    --shadow: 0 6px 20px rgba(60, 40, 20, .10);
    --board-a: #faf6ef;
    --board-b: #f6f0e6;
    --dash: #d8ccbb;
    --danger-line: #efcaca;
    /* papier des plaquettes : identique dans les deux thèmes (les photos sur fond blanc s'y fondent) */
    --paper: #f6f0e6;
    --paper-ink: #2e2219;
    --paper-muted: #7d6e60;
    --paper-line: #e2d6c4;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1c1916; --surface: #27231f; --ink: #f1ebe3; --muted: #a59a8f; --line: #3a342e;
      --accent: #d9694e; --like: #4cb57c; --nope: #e06363;
      --shadow: 0 6px 20px rgba(0, 0, 0, .35);
      --board-a: #221f1b; --board-b: #1f1c18; --dash: #4a4239; --danger-line: #5a2f2f;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #1c1916; --surface: #27231f; --ink: #f1ebe3; --muted: #a59a8f; --line: #3a342e;
    --accent: #d9694e; --like: #4cb57c; --nope: #e06363;
    --shadow: 0 6px 20px rgba(0, 0, 0, .35);
    --board-a: #221f1b; --board-b: #1f1c18; --dash: #4a4239; --danger-line: #5a2f2f;
    color-scheme: dark;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--ink);
    font: 15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    overscroll-behavior: none;
  }
  button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
  .app { max-width: 520px; margin: 0 auto; min-height: 100%; padding-bottom: 84px; }

  header.top {
    position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg);
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px max(16px, env(safe-area-inset-left, 0px)) 10px max(16px, env(safe-area-inset-right, 0px));
  }
  h1 { font-family: Georgia, "Times New Roman", serif; font-weight: 400; font-size: 26px; margin: 0; letter-spacing: -.3px; }
  h1 small { display: block; font-size: 12.5px; line-height: 1.3; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: var(--muted); letter-spacing: .3px; }
  .icon-btn { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; background: var(--surface); box-shadow: var(--shadow); font-size: 18px; }

  section.view { display: none; padding-block: 0; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  section.view.active { display: block; }

  /* chips */
  .chips { display: flex; gap: 8px; overflow-x: auto; padding: 4px 0 10px; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip {
    flex: none; padding: 7px 13px; border-radius: 999px; background: var(--surface);
    border: 1px solid var(--line); font-size: 13.5px; white-space: nowrap;
  }
  .chip.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .row { display: flex; align-items: center; gap: 10px; }
  .row.between { justify-content: space-between; }
  .label { font-size: 12px; text-transform: uppercase; letter-spacing: .8px; color: var(--muted); margin: 6px 0 2px; }
  select.sort { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 6px 8px; font: inherit; font-size: 13.5px; color: var(--ink); }

  /* wardrobe grid */
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .item { position: relative; background: var(--surface); border-radius: 14px; overflow: hidden; box-shadow: var(--shadow); text-align: left; padding: 0; }
  .item .swatch { aspect-ratio: 3/4; max-width: 100%; display: flex; align-items: center; justify-content: center; padding: 12px; background: var(--paper); }
  .item .swatch img, .item .swatch svg { max-width: 100%; max-height: 100%; object-fit: contain; filter: drop-shadow(0 3px 5px rgba(60,40,20,.18)); }
  .item .swatch img { mix-blend-mode: multiply; }
  .item .iname { padding: 7px 8px 0; font-size: 12.5px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item .meta { padding: 2px 8px 8px; font-size: 11.5px; color: var(--muted); }
  .item.washing .swatch { filter: grayscale(.9) opacity(.45); }
  .item .wash {
    position: absolute; top: 6px; right: 6px; width: 30px; height: 30px; border-radius: 50%;
    background: rgba(255,255,255,.85); display: grid; place-items: center; font-size: 15px;
  }
  .item.washing .wash { background: var(--accent); }
  .badge-wash { position: absolute; top: 42%; left: 50%; transform: translate(-50%,-50%); background: var(--ink); color: var(--bg); font-size: 11px; padding: 3px 8px; border-radius: 99px; white-space: nowrap; }
  .group-title { grid-column: 1/-1; font-family: Georgia, serif; font-size: 18px; margin: 10px 0 0; }

  .fab {
    position: fixed; right: max(16px, calc(50% - 244px)); bottom: 96px; z-index: 6;
    background: var(--accent); color: var(--accent-ink); border-radius: 999px; padding: 14px 20px;
    font-weight: 600; box-shadow: 0 10px 24px rgba(196,85,59,.35);
  }

  /* bottom nav */
  nav.tabs {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 7; background: var(--surface);
    border-top: 1px solid var(--line); display: flex; justify-content: center;
    padding: 6px 0 calc(6px + env(safe-area-inset-bottom));
  }
  nav.tabs .inner { display: flex; width: 100%; max-width: 520px; }
  nav.tabs button { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 0; font-size: 11.5px; color: var(--muted); }
  nav.tabs button span { font-size: 21px; filter: grayscale(1) opacity(.6); }
  nav.tabs button.on { color: var(--ink); font-weight: 600; }
  nav.tabs button.on span { filter: none; }

  /* generator */
  .primary { width: 100%; background: var(--ink); color: var(--bg); border-radius: 14px; padding: 13px; font-weight: 600; font-size: 16px; margin: 6px 0 14px; }
  .primary.accent { background: var(--accent); color: var(--accent-ink); }
  .deck { position: relative; height: clamp(340px, calc(100dvh - 470px), 560px); margin-bottom: 14px; }
  .deck-empty { height: 100%; display: grid; place-items: center; text-align: center; color: var(--muted); border: 2px dashed var(--line); border-radius: var(--radius); padding: 24px; }
  .card {
    position: absolute; inset: 0; background: var(--surface); border-radius: var(--radius);
    box-shadow: 0 14px 36px rgba(60,40,20,.16); padding: 14px; touch-action: pan-y; user-select: none;
    display: flex; flex-direction: column; will-change: transform;
  }
  .card.behind { transform: scale(.95) translateY(14px); opacity: .7; pointer-events: none; }
  .card.behind2 { transform: scale(.9) translateY(28px); opacity: .4; pointer-events: none; }
  .card { background: var(--paper); color: var(--paper-ink); }
  .stamp { position: absolute; top: 28px; padding: 6px 14px; border: 3px solid; border-radius: 10px; font-weight: 800; font-size: 22px; letter-spacing: 1px; opacity: 0; z-index: 3; pointer-events: none; background: var(--paper); }
  .stamp.like { left: 22px; color: var(--like); transform: rotate(-12deg); }
  .stamp.nope { right: 22px; color: var(--nope); transform: rotate(12deg); }

  /* plaquette façon lookbook : papier crème, pièces détourées, palette en bas */
  .plaq { flex: 1; display: flex; flex-direction: column; min-height: 0; gap: 8px; color: var(--paper-ink); }
  .plaq-head { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 10px; }
  .plaq-num { width: 34px; height: 34px; border-radius: 50%; background: var(--paper-ink); color: var(--paper); display: grid; place-items: center; font-family: Georgia, serif; font-size: 18px; }
  .plaq-title { font-family: Georgia, "Times New Roman", serif; font-size: 17px; text-transform: uppercase; letter-spacing: .4px; line-height: 1.1; }
  .plaq-title small { display: block; font: italic 12.5px/1.3 Georgia, serif; text-transform: none; letter-spacing: 0; color: var(--paper-muted); margin-top: 2px; }
  .plaq-count { font-size: 11.5px; color: var(--paper-muted); white-space: nowrap; }
  .board { flex: 1; display: grid; gap: 8px 12px; min-height: 0; grid-template-columns: 1.25fr 1fr; grid-template-rows: repeat(6, 1fr); border-top: 1px solid var(--paper-line); padding-top: 10px; }
  .piece { position: relative; display: flex; flex-direction: column; align-items: center; min-height: 0; min-width: 0; }
  .piece .vis { flex: 1; min-height: 0; width: 100%; display: flex; align-items: center; justify-content: center; }
  .piece img, .piece svg { max-width: 100%; max-height: 100%; width: auto; height: 100%; object-fit: contain; filter: drop-shadow(0 4px 6px rgba(60,40,20,.18)); }
  .piece img { mix-blend-mode: multiply; }
  .piece .name { font-size: 11px; color: var(--paper-muted); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding-top: 2px; }
  .piece .acts { position: absolute; top: 0; right: 0; display: flex; gap: 4px; z-index: 2; }
  .piece .acts button { width: 30px; height: 30px; border-radius: 50%; background: var(--paper); color: var(--paper-ink); font-size: 15px; display: grid; place-items: center; box-shadow: 0 2px 6px rgba(0,0,0,.18); }
  .piece.empty { border: 2px dashed var(--paper-line); border-radius: 12px; justify-content: center; color: var(--paper-muted); font-size: 12.5px; }
  .p-top { grid-column: 1; grid-row: 1 / 4; }
  .p-bottom { grid-column: 1; grid-row: 4 / 7; }
  .p-dress { grid-column: 1; grid-row: 1 / 7; }
  .p-outer { grid-column: 2; grid-row: 1 / 3; }
  .p-acc { grid-column: 2; grid-row: 3 / 5; }
  .p-shoes { grid-column: 2; grid-row: 5 / 7; }
  .palette { display: flex; justify-content: center; gap: 10px; padding-top: 4px; }
  .palette i { width: 26px; height: 26px; border-radius: 50%; border: 1px solid rgba(0,0,0,.12); box-shadow: inset 0 -3px 6px rgba(0,0,0,.12); }

  .swipe-btns { display: flex; justify-content: center; gap: 28px; margin-bottom: 8px; }
  .swipe-btns button { width: 58px; height: 58px; border-radius: 50%; background: var(--surface); box-shadow: var(--shadow); font-size: 28px; }
  .swipe-btns .no { color: var(--nope); }
  .swipe-btns .yes { color: var(--like); }
  .hint { text-align: center; color: var(--muted); font-size: 12.5px; margin: 0 0 12px; }

  /* saved */
  .saved-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .mini { background: var(--surface); border-radius: 14px; box-shadow: var(--shadow); padding: 8px; position: relative; }
  .mini { background: var(--paper); color: var(--paper-ink); }
  .mini .plaq { height: 300px; gap: 6px; }
  .mini .plaq-num { width: 24px; height: 24px; font-size: 13px; }
  .mini .plaq-title { font-size: 12px; }
  .mini .plaq-title small, .mini .piece .name, .mini .plaq-count { display: none; }
  .mini .palette i { width: 16px; height: 16px; }
  .mini .board { gap: 4px 6px; padding-top: 6px; }
  .mini .foot { display: flex; justify-content: space-between; align-items: center; padding: 6px 2px 0; font-size: 12px; color: var(--paper-muted); }
  .mini .foot button { color: var(--nope); font-size: 12px; }
  .warn { color: var(--accent); font-weight: 600; }
  .empty-msg { text-align: center; color: var(--muted); padding: 40px 20px; }

  /* sheet */
  .scrim { position: fixed; inset: 0; background: rgba(30,20,10,.4); z-index: 20; display: none; }
  .scrim.open { display: block; }
  .sheet {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 21; max-width: 520px; margin: 0 auto;
    background: var(--surface); border-radius: 22px 22px 0 0; max-height: 92vh; overflow-y: auto;
    padding: 10px 18px calc(18px + env(safe-area-inset-bottom)); transform: translateY(105%); transition: transform .25s ease;
  }
  .sheet.open { transform: none; }
  .grab { width: 40px; height: 5px; border-radius: 3px; background: var(--line); margin: 0 auto 10px; }
  .sheet h2 { font-family: Georgia, serif; font-weight: 400; margin: 0 0 10px; font-size: 22px; }
  .photo-pick { width: 100%; max-width: 100%; aspect-ratio: 16/10; border-radius: 14px; border: 2px dashed var(--line); display: grid; place-items: center; color: var(--muted); margin-bottom: 8px; font-weight: 600; cursor: pointer; position: relative; overflow: hidden; }
  .photo-pick.has { background: var(--paper); border-style: solid; }
  .photo-pick img { max-width: 100%; max-height: 100%; object-fit: contain; mix-blend-mode: multiply; }
  .photo-pick span { position: absolute; bottom: 8px; background: var(--paper-ink); color: var(--paper); font-size: 12px; padding: 4px 10px; border-radius: 99px; }
  input.text { width: 100%; border: 1px solid var(--line); border-radius: 12px; padding: 12px; font: inherit; background: var(--bg); color: var(--ink); }
  .swatches { display: flex; flex-wrap: wrap; gap: 8px; padding: 4px 0 6px; }
  .sw { width: 36px; height: 36px; border-radius: 50%; border: 2px solid rgba(0,0,0,.08); position: relative; }
  .sw.on { outline: 3px solid var(--ink); outline-offset: 2px; }
  .sw-name { font-size: 12.5px; color: var(--muted); }
  .sheet .actions { display: flex; gap: 10px; margin-top: 16px; }
  .sheet .actions button { flex: 1; padding: 13px; border-radius: 12px; font-weight: 600; }
  .btn-ghost { border: 1px solid var(--line) !important; }
  .btn-danger { color: var(--nope); border: 1px solid var(--danger-line) !important; }
  .btn-main { background: var(--ink); color: var(--bg); }
  .tests li { margin: 6px 0; }
  .tests .ok { color: var(--like); }
  .tests .ko { color: var(--nope); }
  .tests small { color: var(--muted); display: block; }

  .vh { position: fixed; left: -9999px; width: 1px; height: 1px; opacity: 0; }
  .import-btn { display: inline-flex; align-items: center; gap: 6px; padding: 7px 12px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); font-size: 13.5px; cursor: pointer; }
  .toast {
    position: fixed; left: 50%; bottom: 100px; transform: translate(-50%, 20px); opacity: 0; z-index: 30;
    background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-size: 14px;
    transition: all .25s; pointer-events: none; max-width: 90vw; text-align: center;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <h1 id="title">Mon dressing<small id="subtitle"></small></h1>
    <button class="icon-btn" data-action="open-settings" aria-label="Réglages et tests">⚙︎</button>
  </header>

  <section class="view active" id="view-dressing">
    <div class="chips" id="cat-chips"></div>
    <div class="row between" style="margin-bottom:10px">
      <label for="files-bulk" class="import-btn">📷 Importer des photos</label>
      <label class="row" style="gap:6px"><span class="sw-name">Trier par</span>
        <select class="sort" id="sort">
          <option value="cat">Catégorie</option>
          <option value="color">Couleur</option>
        </select>
      </label>
    </div>
    <p class="sw-name" id="count-line" style="margin:0 0 8px"></p>
    <div class="grid" id="grid"></div>
    <button class="fab" data-action="add">＋ Ajouter</button>
  </section>

  <section class="view" id="view-generate">
    <div class="label">Saison</div>
    <div class="chips" id="season-chips"></div>
    <div class="label">Style</div>
    <div class="chips" id="style-chips"></div>
    <button class="primary accent" data-action="generate">✨ Générer des tenues</button>
    <div class="deck" id="deck"></div>
    <div class="swipe-btns" id="swipe-btns">
      <button class="no" data-action="nope" aria-label="Je ne veux plus la voir">✕</button>
      <button class="yes" data-action="like" aria-label="Sauvegarder">♥</button>
    </div>
    <p class="hint">Glissez à droite pour garder ♥, à gauche pour écarter ✕. ↻ remplace une pièce.</p>
  </section>

  <section class="view" id="view-saved">
    <div class="saved-grid" id="saved"></div>
  </section>
</div>

<nav class="tabs"><div class="inner">
  <button data-tab="dressing" class="on"><span>👚</span>Dressing</button>
  <button data-tab="generate"><span>✨</span>Générer</button>
  <button data-tab="saved"><span>♥</span>Mes tenues</button>
</div></nav>

<div class="scrim" id="scrim" data-action="close-sheet"></div>
<div class="sheet" id="sheet"></div>
<div class="toast" id="toast"></div>
<input type="file" id="file" accept="image/*" class="vh">
<input type="file" id="files-bulk" accept="image/*" multiple class="vh">

<script>
/* ============================================================
   Données de référence
   ============================================================ */
const CATS = [
  { id: 'haut',       label: 'Haut',             plural: 'Hauts' },
  { id: 'bas',        label: 'Bas',              plural: 'Bas' },
  { id: 'robe',       label: 'Robe',             plural: 'Robes' },
  { id: 'veste',      label: 'Veste / manteau',  plural: 'Vestes' },
  { id: 'chaussures', label: 'Chaussures',       plural: 'Chaussures' },
  { id: 'accessoire', label: 'Accessoire',       plural: 'Accessoires' },
];
const COLORS = [
  { id: 'noir',   label: 'Noir',   hex: '#1f1d1c', neutral: true },
  { id: 'blanc',  label: 'Blanc',  hex: '#f7f5f0', neutral: true },
  { id: 'gris',   label: 'Gris',   hex: '#9c9a97', neutral: true },
  { id: 'beige',  label: 'Beige',  hex: '#d8c4a2', neutral: true },
  { id: 'marine', label: 'Marine', hex: '#1f2e4d', neutral: true },
  { id: 'denim',  label: 'Denim',  hex: '#4d6d93', neutral: true },
  { id: 'rouge',  label: 'Rouge',  hex: '#cf3a35' },
  { id: 'rose',   label: 'Rose',   hex: '#ef94b2' },
  { id: 'orange', label: 'Orange', hex: '#ee8a2c' },
  { id: 'jaune',  label: 'Jaune',  hex: '#f0cd3c' },
  { id: 'vert',   label: 'Vert',   hex: '#4f9a5c' },
  { id: 'bleu',   label: 'Bleu',   hex: '#3b7ed6' },
  { id: 'violet', label: 'Violet', hex: '#8a5cc7' },
  { id: 'marron', label: 'Marron', hex: '#6e4a33' },
  { id: 'kaki',   label: 'Kaki',   hex: '#5e6440' },
  { id: 'bordeaux', label: 'Bordeaux', hex: '#6e2232' },
];
const SEASONS = [
  { id: 'ete', label: 'Été' }, { id: 'mi', label: 'Mi-saison' },
  { id: 'hiver', label: 'Hiver' }, { id: 'toutes', label: 'Toutes' },
];
const STYLES = [{ id: 'casual', label: 'Casual' }, { id: 'chic', label: 'Chic' }, { id: 'sport', label: 'Sport' }];

const colorOf = id => COLORS.find(c => c.id === id) || COLORS[0];
const catOf = id => CATS.find(c => c.id === id);
const labelOf = (list, id) => (list.find(x => x.id === id) || {}).label || id;

const DEMO = [
  ['T-shirt blanc',      'haut',       'blanc',  'toutes', 'casual'],
  ['Débardeur jaune',    'haut',       'jaune',  'ete',    'casual'],
  ['Pull col roulé',     'haut',       'noir',   'hiver',  'chic'],
  ['Chemise blanche',    'haut',       'blanc',  'toutes', 'chic'],
  ['Sweat à capuche',    'haut',       'gris',   'toutes', 'sport'],
  ['Jean brut',          'bas',        'denim',  'toutes', 'casual'],
  ['Pantalon tailleur',  'bas',        'beige',  'toutes', 'chic'],
  ['Jogging',            'bas',        'noir',   'toutes', 'sport'],
  ['Robe portefeuille',  'robe',       'rouge',  'ete',    'chic'],
  ['Manteau en laine',   'veste',      'beige',  'hiver',  'chic'],
  ['Veste en jean',      'veste',      'denim',  'mi',     'casual'],
  ['Baskets blanches',   'chaussures', 'blanc',  'toutes', 'casual'],
  ['Escarpins noirs',    'chaussures', 'noir',   'toutes', 'chic'],
  ['Running',            'chaussures', 'orange', 'toutes', 'sport'],
  ['Foulard en soie',    'accessoire', 'rose',   'toutes', 'chic'],
];
const demoItems = () => DEMO.map(([name, cat, color, season, style], i) =>
  ({ id: 'd' + (i + 1), name, cat, color, season, style, laundry: false, photo: null }));

/* ============================================================
   Moteur de combinaison (fonctions pures, testables)
   ============================================================ */
const Engine = (() => {
  const SLOT_CAT = { top: 'haut', bottom: 'bas', dress: 'robe', shoes: 'chaussures', outer: 'veste', acc: 'accessoire' };
  const BASE_SLOTS = ['top', 'bottom', 'dress', 'shoes'];
  const ALL_SLOTS = ['top', 'bottom', 'dress', 'outer', 'shoes', 'acc'];
  const NEUTRALS = new Set(COLORS.filter(c => c.neutral).map(c => c.id));

  const isNeutral = color => NEUTRALS.has(color);

  // Une pièce est disponible si elle n'est pas au lavage et respecte les filtres.
  function eligible(item, f = {}) {
    if (item.laundry) return false;
    if (f.season && item.season !== f.season && item.season !== 'toutes') return false;
    if (f.style && item.style !== f.style) return false;
    return true;
  }

  // Neutres avec tout ; au plus 2 couleurs vives distinctes par tenue.
  function colorsOk(pieces) {
    const vivid = new Set(pieces.filter(Boolean).map(p => p.color).filter(c => !isNeutral(c)));
    return vivid.size <= 2;
  }

  // Identité d'une tenue = ses pièces principales (haut/bas ou robe + chaussures).
  const baseKey = o => BASE_SLOTS.map(s => o[s] || '-').join('|');
  const ids = o => ALL_SLOTS.map(s => o[s]).filter(Boolean);
  const pieces = (o, byId) => ids(o).map(id => byId[id]);

  // Vérifie la structure : (1 haut + 1 bas) XOR 1 robe, + chaussures, catégories cohérentes.
  function isValid(o, byId) {
    const hasTB = !!o.top && !!o.bottom, hasDress = !!o.dress;
    if (hasTB === hasDress) return false;
    if (hasDress && (o.top || o.bottom)) return false;
    if (!o.shoes) return false;
    for (const s of ALL_SLOTS) if (o[s] && (!byId[o[s]] || byId[o[s]].cat !== SLOT_CAT[s])) return false;
    return true;
  }

  function shuffle(a, rnd) {
    for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
    return a;
  }

  /**
   * Génère toutes les tenues possibles (une par combinaison principale, sans doublon),
   * en excluant les combinaisons déjà refusées/sauvegardées (excluded = Set de baseKey).
   */
  function generate(items, f = {}, excluded = new Set(), opts = {}) {
    const rnd = opts.random || Math.random;
    const max = opts.max || 60;
    const pool = {};
    for (const c of CATS) pool[c.id] = items.filter(i => i.cat === c.id && eligible(i, f));

    const bases = [];
    for (const t of pool.haut) for (const b of pool.bas) for (const s of pool.chaussures)
      bases.push({ top: t.id, bottom: b.id, dress: null, shoes: s.id });
    for (const d of pool.robe) for (const s of pool.chaussures)
      bases.push({ top: null, bottom: null, dress: d.id, shoes: s.id });

    const byId = Object.fromEntries(items.map(i => [i.id, i]));
    const out = [];
    const seen = new Set();
    for (const base of shuffle(bases, rnd)) {
      const key = baseKey(base);
      if (seen.has(key) || excluded.has(key)) continue;
      const basePieces = pieces(base, byId);
      if (!colorsOk(basePieces)) continue;
      seen.add(key);
      const o = { ...base, outer: null, acc: null };
      // Pièces optionnelles : une veste (souvent, toujours en hiver) et parfois un accessoire.
      const wantOuter = f.season === 'hiver' || rnd() < 0.5;
      const wantAcc = rnd() < 0.5;
      if (wantOuter) {
        const c = shuffle(pool.veste.filter(v => colorsOk([...basePieces, v])), rnd)[0];
        if (c) o.outer = c.id;
      }
      if (wantAcc) {
        const cur = pieces(o, byId);
        const c = shuffle(pool.accessoire.filter(a => colorsOk([...cur, a])), rnd)[0];
        if (c) o.acc = c.id;
      }
      out.push(o);
      if (out.length >= max) break;
    }
    return out;
  }

  /**
   * Remplace la pièce d'un emplacement par la suivante compatible (rotation),
   * sans toucher au reste. Renvoie la nouvelle tenue ou null.
   */
  function replace(o, slot, items, f = {}, excluded = new Set()) {
    const byId = Object.fromEntries(items.map(i => [i.id, i]));
    const others = ALL_SLOTS.filter(s => s !== slot).map(s => byId[o[s]]).filter(Boolean);
    const cands = items
      .filter(i => i.cat === SLOT_CAT[slot] && eligible(i, f))
      .filter(i => colorsOk([...others, i]))
      .filter(i => !BASE_SLOTS.includes(slot) || !excluded.has(baseKey({ ...o, [slot]: i.id })))
      .sort((a, b) => a.id < b.id ? -1 : 1);
    const cur = o[slot];
    const rest = cands.filter(i => i.id !== cur);
    if (!rest.length) return null;
    const next = cands.find(i => cur && i.id > cur && i.id !== cur) || rest[0];
    return { ...o, [slot]: next.id };
  }

  return { SLOT_CAT, BASE_SLOTS, ALL_SLOTS, eligible, colorsOk, baseKey, ids, isValid, generate, replace, isNeutral };
})();

function pieceHTML(o, slot, m, interactive) {
  const cls = 'piece p-' + slot;
  const it = o[slot] ? m[o[slot]] : null;
  const optional = slot === 'outer' || slot === 'acc';
  if (!o[slot]) {
    if (!optional) return '';
    const txt = slot === 'outer' ? '+ Veste' : '+ Accessoire';
    return interactive
      ? `<button class="${cls} empty" data-action="replace" data-slot="${slot}">${txt}</button>`
      : `<div class="${cls} empty"></div>`;
  }
  if (!it) return `<div class="${cls} empty">Pièce supprimée</div>`;
  const acts = interactive ? `<div class="acts">
      <button data-action="replace" data-slot="${slot}" aria-label="Remplacer">↻</button>
      ${optional ? `<button data-action="remove-slot" data-slot="${slot}" aria-label="Retirer">✕</button>` : ''}
    </div>` : '';
  return `<div class="${cls}">${acts}<div class="vis">${visual(it)}</div><span class="name">${esc(it.name)}</span></div>`;
}
// Nom et accroche de la plaquette, choisis selon le style dominant (stables pour une même tenue).
const LOOKS = {
  chic: [['Le Classique', 'Intemporel et élégant.'], ["L'Intemporel", 'Chic en toutes occasions.'], ["L'Élégant décontracté", 'Chic sans effort.'], ['Le City Heritage', 'Esprit maison de campagne.']],
  casual: [['Le Smart Casual', 'Sobre et moderne.'], ['Le Moderne', 'Simple et raffiné.'], ['Le Week-end', 'Confort au quotidien.'], ['Le Décontracté', 'Facile à porter.']],
  sport: [["L'Athlétique", 'Prêt à bouger.'], ['Le Sport chic', 'Sportif, mais soigné.'], ["L'Actif", 'Léger et pratique.']],
};
function lookName(o, m) {
  const ps = Engine.ids(o).map(id => m[id]).filter(Boolean);
  const count = {};
  ps.forEach(p => count[p.style] = (count[p.style] || 0) + 1);
  const style = Object.keys(count).sort((a, b) => count[b] - count[a])[0] || 'casual';
  const list = LOOKS[style] || LOOKS.casual;
  let h = 0;
  for (const ch of Engine.baseKey(o)) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
  return list[h % list.length];
}
function boardHTML(o, m, interactive, num, count) {
  const [title, tagline] = lookName(o, m);
  const colors = [...new Set(Engine.ids(o).map(id => m[id]).filter(Boolean).map(p => p.color))];
  return `<div class="plaq">

function generate() {
  const avail = state.items.filter(i => Engine.eligible(i, state.filters));
  state.deck = Engine.generate(state.items, state.filters, excludedKeys());
  state.deckTotal = state.deck.length;
  if (state.deck.length) toast(`${state.deck.length} tenue${state.deck.length > 1 ? 's' : ''} générée${state.deck.length > 1 ? 's' : ''}`);
  else {
    const has = c => avail.some(i => i.cat === c);
    if (!has('chaussures')) toast('Aucune paire de chaussures disponible avec ces filtres.');
    else if (!(has('haut') && has('bas')) && !has('robe')) toast('Il manque un haut + un bas, ou une robe, avec ces filtres.');
    else toast('Plus de nouvelle tenue possible avec ces filtres.');
  }
  render();
}

function decide(liked) {
  const o = state.deck[0];
  if (!o) return;
  const card = $('#top-card');
  const finish = () => {
    state.deck.shift();
    if (liked) state.saved.push({ id: uid(), outfit: o, date: Date.now() });
    else state.rejected.push(Engine.baseKey(o));
    save();
    toast(liked ? 'Ajoutée à Mes tenues ♥' : 'Vous ne la reverrez plus');
    render();
  };
  if (card) {
    card.style.transition = 'transform .28s ease, opacity .28s';
    card.style.transform = `translateX(${liked ? 130 : -130}%) rotate(${liked ? 18 : -18}deg)`;
    card.style.opacity = '0';
    setTimeout(finish, 260);
  } else finish();
}

function replaceSlot(slot) {
  const o = state.deck[0];
  const otherBases = new Set(state.deck.slice(1).map(Engine.baseKey));
  const excluded = new Set([...excludedKeys(), ...otherBases]);
  const next = Engine.replace(o, slot, state.items, state.filters, excluded);
  if (!next) { toast('Aucune autre pièce compatible.'); return; }
  state.deck[0] = next;
  render();
}

function bindSwipe(card) {
  if (!card) return;
  let x0 = null, dx = 0, id = null;
  const like = card.querySelector('.stamp.like'), nope = card.querySelector('.stamp.nope');
  card.addEventListener('pointerdown', e => {
    if (e.target.closest('button')) return;
    x0 = e.clientX; dx = 0; id = e.pointerId; card.setPointerCapture(id); card.style.transition = 'none';
  });
  card.addEventListener('pointermove', e => {
    if (x0 === null || e.pointerId !== id) return;
    dx = e.clientX - x0;
    card.style.transform = `translateX(${dx}px) rotate(${dx / 18}deg)`;
    like.style.opacity = Math.max(0, Math.min(1, dx / 90));
    nope.style.opacity = Math.max(0, Math.min(1, -dx / 90));
  });
  const end = () => {
    if (x0 === null) return;
    x0 = null;
    if (Math.abs(dx) > 90) return decide(dx > 0);
    card.style.transition = 'transform .2s'; card.style.transform = '';
    like.style.opacity = nope.style.opacity = 0;
  };
  card.addEventListener('pointerup', end);
  card.addEventListener('pointercancel', end);
}

// Réduit la photo (stockage local limité) et propose la couleur la plus proche de la palette.
function loadImage(file) {
  return new Promise((res, rej) => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => { URL.revokeObjectURL(url); res(img); };
    img.onerror = () => {
      URL.revokeObjectURL(url);
      const r = new FileReader();   // repli pour les navigateurs qui refusent les blob:
      r.onload = () => { const i2 = new Image(); i2.onload = () => res(i2); i2.onerror = rej; i2.src = r.result; };
      r.onerror = rej; r.readAsDataURL(file);
    };
    img.src = url;
  });
}
function guessColor(cv) {
  const w = cv.width, h = cv.height, d = cv.getContext('2d').getImageData(0, 0, w, h).data;
  const px = (x, y) => { const i = (y * w + x) * 4; return [d[i], d[i + 1], d[i + 2]]; };
  // fond estimé à partir des coins, puis moyenne des pixels centraux qui s'en distinguent
  const corners = [px(2, 2), px(w - 3, 2), px(2, h - 3), px(w - 3, h - 3)];
  const bg = [0, 1, 2].map(k => corners.reduce((a, c) => a + c[k], 0) / 4);
  let sum = [0, 0, 0], n = 0, all = [0, 0, 0], na = 0;
  for (let y = Math.floor(h * .2); y < h * .8; y += 2) for (let x = Math.floor(w * .25); x < w * .75; x += 2) {
    const c = px(x, y);
    all = all.map((v, k) => v + c[k]); na++;
    if (Math.hypot(c[0] - bg[0], c[1] - bg[1], c[2] - bg[2]) > 40) { sum = sum.map((v, k) => v + c[k]); n++; }
  }
  const avg = (n > na * .1 ? sum.map(v => v / n) : all.map(v => v / na));
  let best = COLORS[0], bd = Infinity;
  for (const c of COLORS) {
    const v = parseInt(c.hex.slice(1), 16), rgb = [v >> 16, (v >> 8) & 255, v & 255];
    const dist = Math.hypot(rgb[0] - avg[0], rgb[1] - avg[1], rgb[2] - avg[2]);
    if (dist < bd) { bd = dist; best = c; }
  }
  return best.id;
}
async function resizePhoto(file) {
  const img = await loadImage(file);
  const max = 420, k = Math.min(1, max / Math.max(img.width, img.height));
  const cv = document.createElement('canvas');
  cv.width = Math.max(8, Math.round(img.width * k)); cv.height = Math.max(8, Math.round(img.height * k));
  const ctx = cv.getContext('2d');
  ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, cv.width, cv.height);
  ctx.drawImage(img, 0, 0, cv.width, cv.height);
  let color = 'noir';
  try { color = guessColor(cv); } catch (e) {}
  return { photo: cv.toDataURL('image/jpeg', 0.74), color };
}

/* ---------- réglages & tests automatiques ---------- */
function openSettings(results) {
  openSheet(`
    <h2>Réglages</h2>
    <button class="primary" data-action="run-tests">▶ Lancer les tests automatiques</button>
    ${results ? `<ul class="tests" style="padding-left:18px">${results.map(r =>
      `<li class="${r.ok ? 'ok' : 'ko'}">${r.ok ? '✔' : '✘'} ${r.name}<small>${r.detail}</small></li>`).join('')}</ul>` : ''}
    <div class="actions" style="flex-direction:column">
      <button class="btn-ghost" data-action="reset-rejected">Réafficher les tenues refusées (${state.rejected.length})</button>
      <button class="btn-ghost" data-action="reset-demo">Recharger les 15 pièces de démo</button>
    </div>`);
}

function runTests() {
  const R = [];
  const t = (name, ok, detail) => R.push({ name, ok, detail });
  const mk = (id, cat, color = 'noir', season = 'toutes', style = 'casual') => ({ id, name: id, cat, color, season, style, laundry: false, photo: null });
  const all = (items, f, ex) => Engine.generate(items, f, ex, { max: 10000 });

  // 1. 3 hauts × 2 bas × 2 chaussures = 12 max, sans doublon
  const w1 = [mk('h1', 'haut', 'blanc'), mk('h2', 'haut', 'gris'), mk('h3', 'haut', 'noir'),
              mk('b1', 'bas', 'denim'), mk('b2', 'bas', 'beige'), mk('s1', 'chaussures', 'blanc'), mk('s2', 'chaussures', 'noir')];
  let maxN = 0, dup = false;
  for (let k = 0; k < 30; k++) {
    const g = all(w1);
    maxN = Math.max(maxN, g.length);
    if (new Set(g.map(o => Engine.ids(o).sort().join())).size !== g.length) dup = true;
  }
  t('3 hauts + 2 bas + 2 chaussures → 12 tenues max, sans doublon', maxN === 12 && !dup, `${maxN} tenues générées, doublons : ${dup ? 'oui' : 'non'}`);

  // 2. Structure : jamais 2 hauts, 2 bas, ni robe + bas
  const demo = demoItems(), dm = Object.fromEntries(demo.map(i => [i.id, i]));
  let bad = 0, n2 = 0;
  for (let k = 0; k < 30; k++) for (const o of all(demo)) {
    n2++;
    const cats = Engine.ids(o).map(id => dm[id].cat);
    const count = c => cats.filter(x => x === c).length;
    if (!Engine.isValid(o, dm) || count('haut') > 1 || count('bas') > 1 || (count('robe') && count('bas')) || count('chaussures') !== 1) bad++;
  }
  t('Aucune tenue avec 2 hauts, 2 bas ou robe + bas', bad === 0, `${n2} tenues vérifiées, ${bad} invalide(s)`);

  // 3. Lavage
  const w3 = demoItems(); w3.find(i => i.id === 'd1').laundry = true; w3.find(i => i.id === 'd12').laundry = true;
  let seenWash = 0;
  for (let k = 0; k < 30; k++) for (const o of all(w3)) {
    if (Engine.ids(o).some(id => id === 'd1' || id === 'd12')) seenWash++;
    for (const s of Engine.ALL_SLOTS) { const r = Engine.replace(o, s, w3); if (r && (r[s] === 'd1' || r[s] === 'd12')) seenWash++; }
  }
  t('Une pièce au lavage n\'apparaît dans aucune plaquette', seenWash === 0, `T-shirt blanc + baskets au lavage : ${seenWash} apparition(s), y compris via « Remplacer »`);

  // 4. Filtre été
  let winter = 0;
  for (let k = 0; k < 30; k++) for (const o of all(demo, { season: 'ete' })) {
    if (Engine.ids(o).some(id => dm[id].season === 'hiver')) winter++;
    for (const s of Engine.ALL_SLOTS) { const r = Engine.replace(o, s, demo, { season: 'ete' }); if (r && dm[r[s]].season === 'hiver') winter++; }
  }
  t('Filtre « été » : aucun manteau d\'hiver', winter === 0, `${winter} pièce(s) d'hiver trouvée(s)`);

  // 5. Tenue refusée
  const first = all(demo)[0], rej = new Set([Engine.baseKey(first)]);
  let back = 0;
  for (let k = 0; k < 30; k++) {
    const g = all(demo, {}, rej);
    if (g.some(o => rej.has(Engine.baseKey(o)))) back++;
    for (const o of g) for (const s of Engine.BASE_SLOTS) { const r = Engine.replace(o, s, demo, {}, rej); if (r && rej.has(Engine.baseKey(r))) back++; }
  }
  t('Une tenue refusée ne réapparaît jamais', back === 0, `30 générations + remplacements : ${back} réapparition(s)`);

  // 6. Nouvelle pièce utilisable tout de suite
  const w6 = [...demoItems(), mk('nouveau', 'haut', 'marine')];
  const used = all(w6).some(o => o.top === 'nouveau');
  t('Une pièce ajoutée est utilisée à la génération suivante', used, used ? 'le nouveau haut apparaît dans les tenues' : 'nouveau haut absent');

  // Bonus : règle des couleurs
  const w7 = [mk('r', 'haut', 'rouge'), mk('v', 'bas', 'vert'), mk('j', 'chaussures', 'jaune'), mk('n', 'chaussures', 'noir'), mk('o', 'accessoire', 'orange'), mk('k', 'veste', 'rose')];
  const w7m = Object.fromEntries(w7.map(i => [i.id, i]));
  let tooMany = 0, total7 = 0;
  for (let k = 0; k < 30; k++) for (const o of all(w7)) { total7++; if (!Engine.colorsOk(Engine.ids(o).map(id => w7m[id]))) tooMany++; }
  t('Bonus : maximum 2 couleurs vives par tenue', tooMany === 0 && total7 > 0, `${tooMany} tenue(s) avec 3+ couleurs vives`);

  // Contrôle sur le dressing réel de l'utilisateur
  const m = byId();
  const real = all(state.items, state.filters, excludedKeys());
  const realBad = real.filter(o => !Engine.isValid(o, m) || Engine.ids(o).some(id => m[id].laundry) || !Engine.colorsOk(Engine.ids(o).map(id => m[id])));
  t('Votre dressing actuel', realBad.length === 0, `${real.length} tenue(s) possibles avec les filtres actuels, ${realBad.length} invalide(s)`);
  return R;
}

/* ---------- toast ---------- */
let toastTimer;
function toast(msg) {
  const el = $('#toast'); el.textContent = msg; el.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove('show'), 2200);
}

/* ---------- délégation d'événements ---------- */
document.addEventListener('click', e => {
  const tabBtn = e.target.closest('[data-tab]');
  if (tabBtn) { tab = tabBtn.dataset.tab; window.scrollTo(0, 0); render(); return; }
  const el = e.target.closest('[data-action]');
  if (!el) return;
  const a = el.dataset.action, v = el.dataset.v;
  switch (a) {
    case 'add': openEditor(null); break;
    case 'edit': openEditor(state.items.find(i => i.id === el.dataset.id)); break;
    case 'toggle-wash': {
      e.stopPropagation();
      const it = state.items.find(i => i.id === el.dataset.id);
      it.laundry = !it.laundry; pruneDeck(); save();
      toast(it.laundry ? `« ${it.name} » au lavage` : `« ${it.name} » de retour`);
      render(); break;
    }
    case 'cat-filter': state.catFilter = v; save(); render(); break;
    case 'f-season': state.filters.season = v; state.deck = []; save(); render(); break;
    case 'f-style': state.filters.style = v; state.deck = []; save(); render(); break;
    case 'generate': generate(); break;
    case 'like': decide(true); break;
    case 'nope': decide(false); break;
    case 'replace': replaceSlot(el.dataset.slot); break;
    case 'remove-slot': state.deck[0] = { ...state.deck[0], [el.dataset.slot]: null }; render(); break;
    case 'unsave': state.saved = state.saved.filter(s => s.id !== el.dataset.id); save(); render(); break;
    case 'close-sheet': closeSheet(); break;
    case 'set': syncDraftInputs(); draft[el.dataset.field] = v; renderEditor(); break;
    case 'pick-photo': syncDraftInputs(); break;   // le <label for="file"> ouvre le sélecteur
    case 'skip-item': if (queue.length) openQueued(); else closeSheet(); break;
    case 'clear-photo': syncDraftInputs(); draft.photo = null; renderEditor(); break;
    case 'save-item': saveItem(); break;
    case 'delete':
      if (!el.dataset.armed) { el.dataset.armed = '1'; el.textContent = 'Confirmer la suppression'; break; }
      {
        state.items = state.items.filter(i => i.id !== draft.id);
        pruneDeck(); save(); closeSheet(); toast('Pièce supprimée'); render();
      }
      break;
    case 'open-settings': openSettings(); break;
    case 'run-tests': openSettings(runTests()); break;
    case 'reset-rejected': state.rejected = []; save(); toast('Tenues refusées réinitialisées'); openSettings(); break;
    case 'reset-demo':
      if (!el.dataset.armed) { el.dataset.armed = '1'; el.textContent = 'Toucher encore pour remplacer tout le dressing'; break; }
      {
        state.items = demoItems(); state.saved = []; state.rejected = []; state.deck = [];
        save(); closeSheet(); render(); toast('Démo rechargée');
      }
      break;
  }
});
$('#sort').addEventListener('change', e => { state.sort = e.target.value; save(); render(); });
$('#file').addEventListener('change', async e => {
  const f = e.target.files[0]; e.target.value = '';
  if (!f || !draft) return;
  try {
    const { photo, color } = await resizePhoto(f);
    syncDraftInputs();
    draft.photo = photo;
    if (!draft.id) draft.color = color;   // couleur proposée, modifiable
    renderEditor();
  } catch (err) { toast('Cette image ne peut pas être lue. Essayez une photo JPEG ou PNG.'); }
});
$('#files-bulk').addEventListener('change', async e => {
  const files = [...e.target.files]; e.target.value = '';
  if (!files.length) return;
  toast(`Préparation de ${files.length} photo${files.length > 1 ? 's' : ''}…`);
  queue = [];
  for (const f of files) {
    try { queue.push(await resizePhoto(f)); } catch (err) { /* photo illisible ignorée */ }
  }
  if (!queue.length) { toast('Aucune de ces images ne peut être lue.'); return; }
  queueTotal = queue.length;
  openQueued();
});
document.addEventListener('keydown', e => {
  if (tab !== 'generate' || $('#sheet').classList.contains('open') || !state.deck.length) return;
  if (e.key === 'ArrowRight') decide(true);
  if (e.key === 'ArrowLeft') decide(false);
});

load();
render();
</script>
